<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Almost Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span id="filename">Untitled.md</span>
    <div id="toolbar-right">
      <label class="theme-control" for="theme-select">Theme
        <select id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="theme-control" for="font-size-select">Text size
        <select id="font-size-select">
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="20">20</option>
        </select>
      </label>
      <button id="image-options" type="button">Image options</button>
      <button id="open-project" type="button">Open project</button>
      <button id="toggle-preview" type="button" aria-label="Hide preview" title="Hide preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Zm9.5 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m3 3 18 18"/></svg>
      </button>
    </div>
  </div>
  <div id="workspace" class="project-closed">
    <aside id="post-sidebar" aria-label="Hugo posts">
      <div id="post-sidebar-header">
        <span>Posts</span>
        <button id="new-post" type="button">New post</button>
      </div>
      <div id="project-name">No Hugo project open</div>
      <nav id="post-list"></nav>
    </aside>
    <div id="sidebar-resizer" class="split-resizer" role="separator" aria-label="Resize post sidebar" aria-orientation="vertical"></div>
    <div id="panes">
      <div id="editor" aria-label="Markdown editor"></div>
      <div id="preview-resizer" class="split-resizer" role="separator" aria-label="Resize preview" aria-orientation="vertical"></div>
      <div id="preview"></div>
    </div>
  </div>
  <span id="status" role="status" aria-live="polite"></span>
  <div id="preview-lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <button id="close-lightbox" type="button" aria-label="Close image preview">×</button>
    <img id="lightbox-image" alt="">
  </div>
  <div id="new-post-dialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="new-post-title">
    <form id="new-post-form" class="modal-card">
      <h2 id="new-post-title">Create new post</h2>
      <label for="new-post-name">Post directory name</label>
      <input id="new-post-name" name="name" autocomplete="off" required>
      <p id="new-post-error" class="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button id="cancel-new-post" type="button">Cancel</button>
        <button type="submit">Create Post</button>
      </div>
    </form>
  </div>
  <div id="image-options-dialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="image-options-title">
    <form id="image-options-form" class="modal-card">
      <h2 id="image-options-title">Image options</h2>
      <div class="image-options-grid">
        <label for="image-resize">Image resize</label>
        <input id="image-resize" name="imageResize" placeholder="1500x1500" required>
        <label for="image-quality">Image quality</label>
        <input id="image-quality" name="imageQuality" type="number" min="0" max="100" required>
        <label for="thumbnail-resize">Thumbnail resize</label>
        <input id="thumbnail-resize" name="thumbnailResize" placeholder="500x500" required>
        <label for="thumbnail-quality">Thumbnail quality</label>
        <input id="thumbnail-quality" name="thumbnailQuality" type="number" min="0" max="100" required>
      </div>
      <p id="image-options-error" class="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button id="reset-image-options" type="button">Reset defaults</button>
        <button id="cancel-image-options" type="button">Cancel</button>
        <button type="submit">Save options</button>
      </div>
    </form>
  </div>
  <!-- Preview parsing runs in the page context so a missing optional parser
       module cannot prevent Electron's preload API from loading. -->
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
