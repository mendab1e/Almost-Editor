<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Almost Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span id="filename">Untitled.md</span>
    <div id="toolbar-right">
      <label class="theme-control" for="theme-select">Theme
        <select id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button id="toggle-preview">Hide Preview</button>
      <span id="status"></span>
    </div>
  </div>
  <div id="panes">
    <div id="editor" aria-label="Markdown editor"></div>
    <div id="preview"></div>
  </div>
  <div id="drop-hint">Drop an image anywhere to convert &amp; insert it</div>
  <div id="preview-lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <button id="close-lightbox" type="button" aria-label="Close image preview">×</button>
    <img id="lightbox-image" alt="">
  </div>
  <!-- Preview parsing runs in the page context so a missing optional parser
       module cannot prevent Electron's preload API from loading. -->
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
