<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Almost Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar">
    <span id="filename">Untitled.md</span>
    <div id="toolbar-right">
      <label class="theme-control" for="theme-select">Theme
        <select id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="theme-control" for="font-size-select">Text size
        <select id="font-size-select">
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="20">20</option>
        </select>
      </label>
      <button id="image-options" type="button">Image options</button>
      <button id="open-project" type="button">Open project</button>
      <button id="toggle-preview" type="button" aria-label="Hide preview" title="Hide preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Zm9.5 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m3 3 18 18"/></svg>
      </button>
    </div>
  </div>
  <div id="workspace" class="project-closed">
    <aside id="post-sidebar" aria-label="Hugo posts">
      <div id="post-sidebar-header">
        <span>Posts</span>
        <button id="new-post" type="button">New post</button>
      </div>
      <div id="project-name">No Hugo project open</div>
      <nav id="post-list"></nav>
    </aside>
    <div id="sidebar-resizer" class="split-resizer" role="separator" aria-label="Resize post sidebar" aria-orientation="vertical"></div>
    <div id="panes">
      <section id="editor-pane" aria-label="Markdown editor pane">
        <div id="format-toolbar" role="toolbar" aria-label="Markdown formatting">
          <select id="block-style" aria-label="Text style" title="Text style">
            <option value="" selected disabled>Text style</option>
            <option value="paragraph">Paragraph</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
          </select>
          <span class="format-separator" aria-hidden="true"></span>
          <button type="button" data-format="bold" aria-label="Bold" title="Bold (⌘B)"><strong>B</strong></button>
          <button type="button" data-format="italic" aria-label="Italic" title="Italic (⌘I)"><em>I</em></button>
          <button type="button" data-format="strikethrough" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
          <button type="button" data-format="code" aria-label="Inline code" title="Inline code"><code>&lt;/&gt;</code></button>
          <button id="insert-link" type="button" aria-label="Insert link" title="Insert link (⌘K)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a4 4 0 0 0 5.7 0l2.1-2.1a4 4 0 0 0-5.7-5.7l-1.2 1.2M13.4 10.6a4 4 0 0 0-5.7 0l-2.1 2.1a4 4 0 0 0 5.7 5.7l1.2-1.2"/></svg>
          </button>
          <span class="format-separator" aria-hidden="true"></span>
          <button type="button" data-format="blockquote" aria-label="Block quote" title="Block quote">❯</button>
          <button type="button" data-format="unordered" aria-label="Bulleted list" title="Bulleted list">•≡</button>
          <button type="button" data-format="ordered" aria-label="Numbered list" title="Numbered list">1.</button>
          <button type="button" data-format="task" aria-label="Task list" title="Task list">☑</button>
          <button type="button" data-format="codeblock" aria-label="Code block" title="Code block"><code>{ }</code></button>
          <button type="button" data-format="rule" aria-label="Horizontal rule" title="Horizontal rule">―</button>
        </div>
        <div id="editor" aria-label="Markdown editor"></div>
      </section>
      <div id="preview-resizer" class="split-resizer" role="separator" aria-label="Resize preview" aria-orientation="vertical"></div>
      <div id="preview"></div>
    </div>
  </div>
  <span id="status" role="status" aria-live="polite"></span>
  <span id="dirty-status" class="hidden" role="status" aria-label="Unsaved changes" title="Unsaved changes"><span aria-hidden="true">●</span></span>
  <div id="preview-lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <button id="close-lightbox" type="button" aria-label="Close image preview">×</button>
    <img id="lightbox-image" alt="">
  </div>
  <div id="new-post-dialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="new-post-title">
    <form id="new-post-form" class="modal-card">
      <h2 id="new-post-title">Create new post</h2>
      <label for="new-post-name">Post directory name</label>
      <input id="new-post-name" name="name" autocomplete="off" required>
      <p id="new-post-error" class="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button id="cancel-new-post" type="button">Cancel</button>
        <button type="submit">Create Post</button>
      </div>
    </form>
  </div>
  <div id="link-dialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="link-dialog-title">
    <form id="link-form" class="modal-card">
      <h2 id="link-dialog-title">Insert link</h2>
      <label for="link-text">Link text</label>
      <input id="link-text" name="linkText" autocomplete="off" required>
      <fieldset class="link-target-options">
        <legend>Link to</legend>
        <label><input type="radio" name="linkType" value="url" checked> URL</label>
        <label><input type="radio" name="linkType" value="post"> Blog article</label>
      </fieldset>
      <div id="link-url-fields">
        <label for="link-url">URL</label>
        <input id="link-url" name="url" type="text" inputmode="url" placeholder="https://example.com">
      </div>
      <div id="link-post-fields" class="hidden">
        <label for="link-post">Blog article</label>
        <select id="link-post" name="post"></select>
        <p class="field-help">Article links use Hugo's <code>ref</code> shortcode.</p>
      </div>
      <p id="link-error" class="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button id="cancel-link" type="button">Cancel</button>
        <button type="submit">Insert link</button>
      </div>
    </form>
  </div>
  <div id="image-options-dialog" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="image-options-title">
    <form id="image-options-form" class="modal-card image-options-card">
      <h2 id="image-options-title">Image options</h2>
      <section class="image-options-section" aria-labelledby="image-size-title">
        <div class="image-options-section-header">
          <h3 id="image-size-title">Image size and quality</h3>
          <button id="reset-image-size" type="button">Reset image defaults</button>
        </div>
        <div class="image-options-grid">
          <label for="image-resize">Image resize</label>
          <input id="image-resize" name="imageResize" placeholder="1500x1500" required>
          <label for="image-quality">Image quality</label>
          <input id="image-quality" name="imageQuality" type="number" min="0" max="100" required>
          <label for="thumbnail-resize">Thumbnail resize</label>
          <input id="thumbnail-resize" name="thumbnailResize" placeholder="500x500" required>
          <label for="thumbnail-quality">Thumbnail quality</label>
          <input id="thumbnail-quality" name="thumbnailQuality" type="number" min="0" max="100" required>
        </div>
      </section>
      <section class="image-options-section" aria-labelledby="image-shortcode-title">
        <div class="image-options-section-header">
          <h3 id="image-shortcode-title">Inserted shortcode</h3>
          <button id="reset-image-shortcode" type="button">Reset shortcode default</button>
        </div>
        <label for="image-shortcode-template">Shortcode template</label>
        <textarea id="image-shortcode-template" name="imageShortcodeTemplate" rows="3" spellcheck="false" required></textarea>
        <p class="field-help">Use <code>{src}</code>, <code>{thumb}</code>, and <code>{alt}</code> where the generated values should be inserted. The template must include <code>{src}</code>.</p>
      </section>
      <p id="image-options-error" class="modal-error" role="alert"></p>
      <div class="modal-actions">
        <button id="cancel-image-options" type="button">Cancel</button>
        <button type="submit">Save options</button>
      </div>
    </form>
  </div>
  <!-- Preview parsing runs in the page context so a missing optional parser
       module cannot prevent Electron's preload API from loading. -->
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
